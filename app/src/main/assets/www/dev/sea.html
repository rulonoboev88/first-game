<!doctype html><meta charset="utf-8"><body style="margin:0;background:#BDE8FF">
<canvas id="c" width="1300" height="560"></canvas>
<script type="module">
import { drawFish, drawBottom, FISH, BOTTOM } from '../js/art/sea.js';
const c=document.getElementById('c'), ctx=c.getContext('2d');
FISH.forEach((k,i)=>drawFish(ctx,k,100+(i%6)*210,100+Math.floor(i/6)*190,130,1,{t:1.3,open:i===3?1:0}));
BOTTOM.forEach((k,i)=>drawBottom(ctx,k,150+i*250,540,110,{t:1}));
</script>
