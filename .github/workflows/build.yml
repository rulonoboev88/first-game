name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore signing key
        env:
          FG_KEYSTORE_B64: ${{ secrets.FG_KEYSTORE_B64 }}
        run: |
          if [ -n "$FG_KEYSTORE_B64" ]; then
            echo "$FG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FG_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with release key"
          else
            echo "::warning::No release key in secrets - building with debug key"
          fi

      - name: Build APK and AAB
        env:
          FG_KEYSTORE_PASSWORD: ${{ secrets.FG_KEYSTORE_PASSWORD }}
          FG_KEY_ALIAS: ${{ secrets.FG_KEY_ALIAS }}
          FG_KEY_PASSWORD: ${{ secrets.FG_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Collect outputs
        run: |
          mkdir -p out
          V="0.1.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/*.apk "out/first-game-$V.apk"
          cp app/build/outputs/bundle/release/*.aab "out/first-game-$V.aab"
          cp "out/first-game-$V.apk" out/first-game.apk
          echo "$V" > out/version.txt
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: first-game-0.1.${{ github.run_number }}
          path: out/*
          retention-days: 30

      # Постоянная ссылка для установки на телефон:
      # https://github.com/rulonoboev88/first-game/releases/latest/download/first-game.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="0.1.${GITHUB_RUN_NUMBER}"
          gh release create "v$V" out/first-game.apk "out/first-game-$V.apk" "out/first-game-$V.aab" \
            --title "First Game $V" --target "$GITHUB_SHA" --latest \
            --notes "Build $V from ${GITHUB_SHA::7}. Install: download first-game.apk on your Android phone and open it."

      # Копия в ветку builds — оттуда сборку забирает разработка (git-доступ).
      - name: Push to builds branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cd out
          git init -q -b builds
          git add first-game.apk version.txt
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Build $(cat version.txt)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
